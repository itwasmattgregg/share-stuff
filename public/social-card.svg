<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.45" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="headline" x1="140" y1="300" x2="900" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1080" cy="120" r="200" fill="#2563eb" opacity="0.07"/>
  <circle cx="120" cy="510" r="240" fill="#4f46e5" opacity="0.07"/>
  <circle cx="920" cy="560" r="160" fill="#0ea5e9" opacity="0.05"/>

  <g filter="url(#shadow)">
    <rect x="80" y="90" width="1040" height="450" rx="32" fill="white" opacity="0.98"/>
  </g>

  <!-- ShareStuff mark (same geometry as favicon.svg / ShareStuffMark) -->
  <g transform="translate(140 145) scale(2.083333)">
    <rect width="48" height="48" rx="13" fill="url(#brand)"/>
    <path d="M24 30.4 18.2 24.6A3.95 3.95 0 0 1 24 19.15a3.95 3.95 0 0 1 5.8 5.45Z" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M10.6 19.7A12.6 12.6 0 0 1 37.4 19.7"/>
      <path d="M38.55 14.7 37.4 19.7 33.3 16.55"/>
      <path d="M37.4 28.3A12.6 12.6 0 0 1 10.6 28.3"/>
      <path d="M9.45 33.3 10.6 28.3 14.7 31.45"/>
    </g>
  </g>

  <text x="270" y="210" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">
    ShareStuff
  </text>

  <text x="140" y="300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">
    Private library communities
  </text>
  <text x="140" y="360" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="800" fill="url(#headline)" letter-spacing="-0.02em">
    for the people you trust
  </text>

  <text x="140" y="430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="500" fill="#475569" letter-spacing="0.01em">
    Invite-only libraries — books, tools &amp; more with your community
  </text>
</svg>
